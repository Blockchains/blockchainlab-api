name: nightly-data
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: nightly-data, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - run: pip install jsonschema==4.23.0 pyyaml
      - run: node scripts/build.mjs
      - name: Validate every dataset against its committed JSON Schema (blocks the commit on failure)
        run: python3 scripts/validate.py
      - run: python3 scripts/openapi.py
      - name: Commit if changed
        run: |
          git config user.name "blockchainlab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1 openapi.json openapi.yaml
          git diff --cached --quiet || (git commit -m "data: nightly refresh $(date -u +%F)" && git push)
